name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/**

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

  macos-shell:
    name: macOS Shell Build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust FFI staticlib
        run: ./scripts/build-ffi.sh

      - name: Swift Build
        run: swift build --package-path apps/macos

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --config apps/macos/.swiftlint.yml --path apps/macos/Sources/SynticApp
